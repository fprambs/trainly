# Pruebas automáticas: en cada cambio se recorre la app en celular, celular chico, tablet y tablet horizontal
# con un Supabase simulado (no toca datos reales). Si algo falla, queda el informe con capturas para revisarlo.
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-pruebas
          path: playwright-report
          retention-days: 14
